services:
  - type: web
    name: nova-academy-pilot
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime
      - key: MAX_DAILY_VOICE_SESSIONS
        value: '12'
      - key: OPENAI_TEXT_MODEL
        value: gpt-5-mini
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_STT_MODEL
        value: gpt-transcribe
      - key: OPENAI_DEFAULT_VOICE
        value: marin
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1-mini
      - key: ENABLE_LIVE_IMAGES
        value: 'false'
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_ACCESS_PASSWORD
        sync: false
      - key: DEMO_ACCOUNTS_JSON
        value: '[]'
